<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Product Cards</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="product-list">
      <div class="product">
        <img src="https://png.pngtree.com/png-clipart/20240705/original/pngtree-fastfood-takeaway-junk-food-and-drinks-png-image_15492025.png" alt="Sản phẩm 2" />
        <h2>Đồ ăn nhanh</h2>
        <p class="price">30.000-100.000 VNĐ</p>
        <p class="description">Đồ ăn nhanh ngon, tiện lợi cho bữa ăn nhanh.</p>
        <button class="buy-button">Mua ngay</button>
      </div>

      <div class="product">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6UgpH4whvCg8pGouj3iO_NG60Q-LHPrHfhWInAReDdvO3B5_ka_sBLISo&s=10" alt="Sản phẩm 2" />
        <h2>Nước uống</h2>
        <p class="price">15.000-30.000 VNĐ</p>
        <p class="description">Nước uống giải khát ngon, giúp bổ sung năng lượng.</p>
        <button class="buy-button">Mua ngay</button>
      </div>

      <div class="product">
        <img src="https://cdn.tgdd.vn/2021/11/CookDish/tong-hop-40-cach-lam-cac-mon-trang-mieng-dai-tiec-thom-ngon-avt-1200x676.jpg" alt="Sản phẩm 3" />
        <h2>Tráng miệng</h2>
        <p class="price">20.000-50.000 VNĐ</p>
        <p class="description">Tráng miệng ngon, giúp hoàn thiện bữa ăn.</p>
        <button class="buy-button">Mua ngay</button>
      </div>
    </div>
  </body>
</html>
